[project]
name = "narya-mcp"
version = "0.1.0"
description = "MCP server for Narya proof development"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.1",
    "psutil>=7.2.2",
]

[project.urls]
Repository = "https://github.com/balalaika-ai/narya-mcp"

[project.scripts]
narya-mcp = "narya_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
